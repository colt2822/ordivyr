[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ordivyr"
version = "0.5.0"
description = "Open-source multi-agent Board: durable queue, BYO-key spending budgets, local-LLM/GPU management, plugins (MCP, A2A, n8n, LangGraph, skills)"
readme = "README.md"
authors = [{ name = "ELYRAON" }]
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["agents", "orchestration", "multi-agent", "llm", "mcp", "self-hosted"]
dependencies = ["cryptography>=50.0.2"]
classifiers = ["Development Status :: 4 - Beta", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Operating System :: POSIX :: Linux", "Intended Audience :: Developers"]

[project.urls]
Homepage = "https://github.com/colt2822/ordivyr"
Issues = "https://github.com/colt2822/ordivyr/issues"

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3"]
dev = ["pytest>=8"]

[project.scripts]
ordivyr = "ordivyr.cli:main"
ordivyr-board = "ordivyr.board.__main__:main"

[tool.setuptools.packages.find]
include = ["ordivyr*"]
exclude = ["ordivyr.tests*"]

[tool.setuptools.package-data]
ordivyr = ["team_templates/*.json", "docs/*.md", "examples/plugins/*/*"]
"ordivyr.board" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["ordivyr/tests"]
pythonpath = ["ordivyr/tests"]
