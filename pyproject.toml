[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ordivyr"
version = "0.4.0a0"
description = "Open multi-agent orchestration core: License trees, Gambits, BYOK, local-LLM/GPU management, plugins (MCP, A2A, n8n, LangGraph, skills)"
readme = "README.md"
authors = [{ name = "ELYREON" }]
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []
classifiers = ["Development Status :: 3 - Alpha", "License :: OSI Approved :: Apache Software License", "Programming Language :: Python :: 3", "Operating System :: POSIX :: Linux"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
ordivyr = "ordivyr.cli:main"

[tool.setuptools.packages.find]
include = ["ordivyr*"]

[tool.setuptools.package-data]
ordivyr = ["team_templates/*.json", "docs/*.md", "examples/plugins/*/*", "tests/fixtures/*"]

[tool.pytest.ini_options]
testpaths = ["ordivyr/tests"]
pythonpath = ["ordivyr/tests"]
